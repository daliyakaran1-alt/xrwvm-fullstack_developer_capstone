name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

    - name: Run linting with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Django system checks and migrations
      run: |
        cd server
        python manage.py check
        python manage.py makemigrations
        python manage.py migrate

